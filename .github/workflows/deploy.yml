name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the GitHub Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Vendors the MediaPipe model + wasm into public/models (gitignored).
      - run: npm run fetch-models
      - run: npm run build
      # Pull the demo video from the v1.0 release so the site can serve it
      # (it's 90 MB, so it's kept out of git).
      - name: Add demo video
        run: gh release download v1.0 --repo "$GITHUB_REPOSITORY" --pattern camheart-demo.mp4 --dir dist || echo "Demo video not found; skipping."
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
